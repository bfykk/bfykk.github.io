<style>
.post-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px;margin-top:26px}
.post-card{display:flex;flex-direction:column;gap:10px;padding:26px 24px}
.post-card .pdate{font-size:12px;color:var(--text-mute);letter-spacing:.02em}
.post-card h3{font-size:17.5px;line-height:1.5;margin:0}
.post-card h3 a{color:var(--text);text-decoration:none}
.post-card h3 a:hover{color:var(--accent)}
.post-card p{font-size:13.5px;line-height:1.75;color:var(--text-sub);margin:0}
.post-card .ptags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.empty{color:var(--text-sub);font-size:14px;border:1px dashed var(--border);border-radius:14px;padding:26px;text-align:center;margin-top:24px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:22px;min-height:30px}
.fb{font-size:12.5px;padding:6px 13px;border-radius:9px;border:1px solid var(--border);color:var(--text-sub);text-decoration:none;transition:all .16s}
.fb:hover{border-color:var(--border-strong);color:var(--accent)}
.fb.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.fsep{width:1px;height:15px;background:var(--border);margin:0 3px}
</style>
</head>
<body>
<header class="nav">
  <div class="nav-in">
    <a class="brand" href="../index.html"><i class="dot"></i><span>冷月技术网</span></a>
    <nav class="menu"></nav>
    <button class="theme-btn" id="themeBtn" aria-label="切换明暗主题" title="切换明暗主题">
      <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.4M12 19.2v2.4M4.4 12H2M22 12h-2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M18.8 5.2l-1.7 1.7M6.9 17.1l-1.7 1.7"/></svg>
      <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" style="display:none"><path d="M20.6 14.2A8.6 8.6 0 0 1 9.8 3.4a8.9 8.9 0 1 0 10.8 10.8z"/></svg>
    </button>
  </div>
</header>
<main class="page">
  <div class="wrap">
    <div class="crumb"><a href="../index.html">主页</a><span>/</span><span>博客</span></div>
    <h1>博客</h1>
    <div class="prose">
      <p>装机的踩坑记录、硬件兼容实测，还有平时折腾下来的零碎笔记。不追热点，只写自己真机跑过的。</p>
    </div>
    <div class="filters" id="filters"></div>
    <div id="postList" class="post-grid"></div>
    <div id="postEmpty" class="empty" style="display:none">还没有文章。等第一台机器跑通，我把过程写在这儿。</div>
    <div class="page-cta">
      <p>有装机需求、或者卡在某一步过不去，把 <b>型号 / CPU / 无线网卡</b> 发过来。</p>

      </div>
    </div>
  </div>
</main>
<footer>
  <div class="wrap foot-in">
    <div class="l"><i class="dot" style="width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block"></i><b>冷月技术网</b><span>· 重庆</span></div>
    <div>© 2026 冷月技术网 · Built for the machines that shouldn't work</div>
  </div>
</footer>
<script>(function(){
  var root = document.documentElement, btn = document.getElementById('themeBtn');
  var sun = document.getElementById('iconSun'), moon = document.getElementById('iconMoon');
  var stored = null;
  try { stored = localStorage.getItem('ly-theme'); } catch(e){}
  function apply(t){
    root.setAttribute('data-theme', t);
    var dark = t === 'dark';
    sun.style.display = dark ? 'block' : 'none';
    moon.style.display = dark ? 'none' : 'block';
  }
  function sys(){ return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
  apply(stored || sys());
  btn.addEventListener('click', function(){
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    apply(next);
    try { localStorage.setItem('ly-theme', next); } catch(e){}
  });
  var mq = window.matchMedia('(prefers-color-scheme: light)');
  if(mq.addEventListener) mq.addEventListener('change', function(){ if(!stored) apply(sys()); });
})();</script>
<script>
(function(){
  var list = document.getElementById('postList'), empty = document.getElementById('postEmpty'), bar = document.getElementById('filters');
  var qs = new URLSearchParams(location.search);
  var curCat = qs.get('cat') || '', curTag = qs.get('tag') || '';
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function chip(label, href, on){ return '<a class="fb'+(on?' on':'')+'" href="'+href+'">'+esc(label)+'</a>'; }
  fetch('posts.json', { cache: 'no-cache' }).then(function(r){ return r.json(); }).then(function(posts){
    if (!Array.isArray(posts) || !posts.length) {
      list.style.display='none'; empty.style.display='block'; bar.style.display='none'; return;
    }
    posts.sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });

    var cats = [], tags = [];
    posts.forEach(function(p){
      if (p.cat && cats.indexOf(p.cat) < 0) cats.push(p.cat);
      (p.tags||[]).forEach(function(t){ if (tags.indexOf(t) < 0) tags.push(t); });
    });
    var f = chip('全部', 'index.html', !curCat && !curTag);
    if (cats.length) f += '<span class="fsep"></span>' + cats.map(function(c){
      return chip(c, '?cat=' + encodeURIComponent(c), curCat === c);
    }).join('');
    if (tags.length) f += '<span class="fsep"></span>' + tags.map(function(t){
      return chip('#' + t, '?tag=' + encodeURIComponent(t), curTag === t);
    }).join('');
    bar.innerHTML = f;

    var shown = posts.filter(function(p){
      if (curCat && p.cat !== curCat) return false;
      if (curTag && (p.tags||[]).indexOf(curTag) < 0) return false;
      return true;
    });
    if (!shown.length) {
      list.style.display='none'; empty.style.display='block';
      empty.textContent = '这一栏还没文章，换别的看看。';
      return;
    }
    list.style.display=''; empty.style.display='none';
    list.innerHTML = shown.map(function(p){
      var ct = p.cat ? '<span class="chip">'+esc(p.cat)+'</span>' : '';
      var tg = (p.tags||[]).map(function(t){ return '<span class="chip">'+esc(t)+'</span>'; }).join('');
      return '<article class="card post-card">'
        + '<div class="pdate">'+esc(p.date||'')+'</div>'
        + '<h3><a href="'+esc(p.slug)+'.html">'+esc(p.title)+'</a></h3>'
        + '<p>'+esc(p.summary||'')+'</p>'
        + ((ct||tg) ? '<div class="ptags">'+ct+tg+'</div>' : '')
        + '<a class="dllink" href="'+esc(p.slug)+'.html">阅读全文 →</a>'
        + '</article>';
    }).join('');
  }).catch(function(){
    list.style.display='none'; empty.style.display='block';
  });
})();
</script>
  <script src="/assets/nav.js"></script>
</body>
</html>
