<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>整站文件 · 冷月技术网</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../assets/avatar.png">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<style>
.fl-wrap{display:grid;grid-template-columns:280px 1fr;gap:16px;margin-top:22px;align-items:start}
.fl-wrap[hidden]{display:none}
.fl-side{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;max-height:72vh;overflow:auto}
.fl-side h4{font-size:12px;color:var(--text-mute);margin:12px 4px 6px;letter-spacing:.06em;text-transform:uppercase}
.fl-side h4:first-child{margin-top:2px}
.fitem{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:8px;font-size:13px;
  color:var(--text-sub);cursor:pointer;border:1px solid transparent;font-family:"JetBrains Mono",Consolas,monospace}
.fitem:hover{background:var(--bg-soft);color:var(--text)}
.fitem.on{background:var(--bg-soft);border-color:var(--border-strong);color:var(--accent)}
.fitem.dir{color:var(--text);font-weight:600}
.fitem.dim{color:var(--text-mute);opacity:.72}
.fl-main{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px}
.fl-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:11px}
.fl-path{font-size:12.5px;color:var(--text-sub);font-family:"JetBrains Mono",Consolas,monospace;flex:1;word-break:break-all}
.fl-code{width:100%;box-sizing:border-box;min-height:58vh;background:var(--bg-soft);border:1px solid var(--border);
  border-radius:11px;padding:12px 14px;color:var(--text);font-family:"JetBrains Mono",Consolas,monospace;
  font-size:13px;line-height:1.65;resize:vertical;outline:none}
.fl-code:focus{border-color:var(--border-strong)}
.fl-msg{font-size:12.5px;color:var(--text-sub)}
.fl-msg.ok{color:#5eead4}
.fl-msg.bad{color:#fca5a5}
.apanel{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px 26px;margin-top:20px}
.apanel[hidden]{display:none}
.apanel h2{font-size:16px;margin:0 0 6px}
.apanel .sub{font-size:13px;color:var(--text-sub);line-height:1.75;margin:0 0 16px}
.fld{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.fld label{font-size:12.5px;color:var(--text-sub);font-weight:600}
.inp{width:100%;box-sizing:border-box;background:var(--bg-soft);border:1px solid var(--border);border-radius:11px;
  padding:11px 13px;color:var(--text);font-family:inherit;font-size:14px;outline:none}
.inp:focus{border-color:var(--border-strong)}
.abar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
@media(max-width:820px){.fl-wrap{grid-template-columns:1fr}.fl-side{max-height:38vh}}
</style>
</head>
<body>
<header class="nav">
  <div class="nav-in">
    <a class="brand" href="../index.html"><i class="dot"></i><span>冷月技术网</span></a>
    <nav class="menu">
      <a href="../index.html">主页</a>
      <a href="../blog/index.html">博客</a>
      <a href="index.html">写文章</a>
    </nav>
    <button class="theme-btn" id="themeBtn" aria-label="切换明暗主题" title="切换明暗主题">
      <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.4M12 19.2v2.4M4.4 12H2M22 12h-2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M18.8 5.2l-1.7 1.7M6.9 17.1l-1.7 1.7"/></svg>
      <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" style="display:none"><path d="M20.6 14.2A8.6 8.6 0 0 1 9.8 3.4a8.9 8.9 0 1 0 10.8 10.8z"/></svg>
    </button>
  </div>
</header>
<main class="page">
  <div class="wrap" style="max-width:1180px">
    <div class="crumb"><a href="index.html">后台</a><span>/</span><span>整站文件</span></div>
    <h1 style="font-size:34px">整站文件</h1>
    <p style="font-size:14px;color:var(--text-sub);line-height:1.8;max-width:760px">
      左边是整站所有文件，点开就能改，保存即提交上线。页面结构、文案、样式、脚本逻辑都在这儿，改前想清楚，改完一分钟生效。
    </p>

    <section class="apanel" id="gate">
      <h2>输入密码</h2>
      <p class="sub">和写文章那个密码一样。</p>
      <div class="fld">
        <label>密码</label>
        <input class="inp" id="gPass" type="password" placeholder="输入密码" autocomplete="current-password">
      </div>
      <div class="abar">
        <button class="btn btn-primary" id="btnGate" style="margin:0">进入</button>
        <div class="fl-msg" id="gMsg"></div>
      </div>
    </section>

    <div class="fl-wrap" id="browser" hidden>
      <aside class="fl-side" id="side"></aside>
      <section class="fl-main">
        <div class="fl-bar">
          <span class="fl-path" id="curPath">还没选文件</span>
          <button class="mini" id="btnSave" style="padding:7px 14px" disabled>保存并上线</button>
          <button class="mini" id="btnReload" style="padding:7px 14px" disabled>放弃修改</button>
        </div>
        <textarea class="fl-code" id="code" spellcheck="false" placeholder="在左边选一个文件" disabled></textarea>
        <div class="fl-msg" id="fMsg" style="margin-top:10px"></div>
      </section>
    </div>
  </div>
</main>
<footer>
  <div class="wrap foot-in">
    <div class="l"><i class="dot" style="width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block"></i><b>冷月技术网</b><span>· 整站文件</span></div>
    <div>© 2026 冷月技术网</div>
  </div>
</footer>
<script src="../assets/files.js"></script>
<script>(function(){
  var root = document.documentElement, btn = document.getElementById('themeBtn');
  var sun = document.getElementById('iconSun'), moon = document.getElementById('iconMoon');
  var stored = null;
  try { stored = localStorage.getItem('ly-theme'); } catch(e){}
  function apply(t){
    root.setAttribute('data-theme', t);
    var dark = t === 'dark';
    sun.style.display = dark ? 'block' : 'none';
    moon.style.display = dark ? 'none' : 'block';
  }
  function sys(){ return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
  apply(stored || sys());
  btn.addEventListener('click', function(){
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    apply(next);
    try { localStorage.setItem('ly-theme', next); } catch(e){}
  });
})();</script>
</body>
</html>
